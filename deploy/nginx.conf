# Reverse proxy for the docker-compose stack. For HTTPS either:
#  • put Cloudflare / Caddy / a cloud load balancer in front of this container, or
#  • add a `listen 443 ssl` server block with certbot certificates.
# Whatever terminates TLS must send X-Forwarded-Proto: https (the app trusts it).
upstream app { server web:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;          # multi-photo listing uploads
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Public uploads (listing photos, avatars). NID photos are NOT here — they stay private.
    location /media/ {
        alias /data/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # If TLS is terminated upstream of this nginx, use $http_x_forwarded_proto instead of $scheme.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
