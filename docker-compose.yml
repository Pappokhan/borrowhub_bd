# Production-style stack:  docker compose up -d --build
# 1) cp .env.example .env and fill it in   2) put TLS in front (Caddy / Cloudflare / certbot) — see README
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-borrowhub}
      POSTGRES_USER: ${POSTGRES_USER:-borrowhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-borrowhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-borrowhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-borrowhub}
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes:
      - media:/data/media
      - private_media:/data/private_media
    expose: ["8000"]

  # Hourly housekeeping: expires unanswered / unpaid requests and auto-accepts silent inspections
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-borrowhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-borrowhub}
      REDIS_URL: redis://redis:6379/1
    depends_on:
      web: {condition: service_started}
    entrypoint: []
    command: ["sh", "-c", "while true; do python manage.py expire_bookings; sleep 3600; done"]
    volumes: [media:/data/media, private_media:/data/private_media]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro

volumes:
  pgdata:
  media:
  private_media:
